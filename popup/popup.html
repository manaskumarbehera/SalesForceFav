<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SalesForceFav</title>
    <link rel="stylesheet" href="popup.css" />
    <script defer src="vendor/qrcode.js"></script>
    <script defer src="credentials.js"></script>
    <script defer src="cryptovault.js"></script>
    <script defer src="popup.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <img class="brand-logo" src="../icons/icon-48.png" alt="" />
          <div class="brand-text">
            <h1>SalesForceFav</h1>
            <span class="brand-sub" id="countLabel"></span>
          </div>
        </div>
        <div class="header-actions">
          <button
            id="lockToggle"
            class="icon-btn"
            title="Encryption"
            aria-label="Encryption"
          ></button>
          <button
            id="auditBtn"
            class="icon-btn"
            title="Security check"
            aria-label="Security check"
            hidden
          >
            <span class="audit-badge" id="auditBadge"></span>
          </button>
          <button
            id="themeToggle"
            class="icon-btn"
            title="Toggle theme"
            aria-label="Toggle theme"
          ></button>
        </div>
      </header>

      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon" id="searchIcon" aria-hidden="true"></span>
          <input id="searchInput" type="search" placeholder="Search orgs" autocomplete="off" />
        </div>
        <button id="addBtn" class="btn btn-primary" title="Add org" aria-label="Add org"></button>
        <button
          id="importBtn"
          class="btn"
          title="Restore from backup"
          aria-label="Restore from backup"
        ></button>
        <button
          id="exportBtn"
          class="btn"
          title="Back up to file"
          aria-label="Back up to file"
        ></button>
        <input id="importFile" type="file" accept="application/json,.json" hidden />
      </div>

      <div id="formContainer" class="form-panel" hidden></div>

      <ul id="credentialList" class="cred-list"></ul>

      <div id="emptyState" class="empty" hidden>
        <div class="empty-icon" id="emptyIcon"></div>
        <p class="empty-title">No saved orgs yet</p>
        <p class="empty-sub" id="emptySub">
          Add your first Salesforce login, or restore from a backup.
        </p>
      </div>

      <div id="toast" class="toast" role="status" hidden></div>

      <!-- Lock / setup overlay (shown when the encrypted vault is locked, or when
           enabling encryption). Covers the app so the list isn't usable while locked. -->
      <div id="lockScreen" class="lock-screen" hidden>
        <div class="lock-card">
          <div class="lock-icon" id="lockIcon"></div>
          <h2 id="lockTitle">Unlock</h2>
          <p id="lockHint" class="lock-hint"></p>
          <input id="lockPass" type="password" placeholder="Master passphrase" autocomplete="off" />
          <input
            id="lockPass2"
            type="password"
            placeholder="Confirm passphrase"
            autocomplete="off"
            hidden
          />
          <div id="lockError" class="lock-error" hidden></div>
          <button id="lockBtn" class="btn btn-primary">Unlock</button>
        </div>
      </div>
    </div>
  </body>
</html>
