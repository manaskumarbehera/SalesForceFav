<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SalesForceFav</title>
    <link rel="stylesheet" href="popup.css" />
    <script defer src="credentials.js"></script>
    <script defer src="cryptovault.js"></script>
    <script defer src="vendor/qrcode.js"></script>
    <script defer src="popup.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <img class="brand-logo" src="../icons/icon-48.png" alt="" />
          <div class="brand-text">
            <h1>SalesForceFav</h1>
            <span class="brand-sub" id="countLabel"></span>
          </div>
        </div>
        <div class="header-actions">
          <button
            id="encDisable"
            class="icon-btn"
            title="Turn off encryption"
            aria-label="Turn off encryption"
            hidden
          ></button>
          <button
            id="lockToggle"
            class="icon-btn"
            title="Encryption"
            aria-label="Encryption"
          ></button>
          <button
            id="auditBtn"
            class="icon-btn"
            title="Security check"
            aria-label="Security check"
            hidden
          >
            <span class="audit-badge" id="auditBadge"></span>
          </button>
          <button
            id="deviceUnlockToggle"
            class="icon-btn"
            title="Enable biometric unlock"
            aria-label="Enable biometric unlock"
            hidden
          ></button>
          <button
            id="themeToggle"
            class="icon-btn"
            title="Toggle theme"
            aria-label="Toggle theme"
          ></button>
        </div>
      </header>

      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon" id="searchIcon" aria-hidden="true"></span>
          <input id="searchInput" type="search" placeholder="Search orgs" autocomplete="off" />
        </div>
        <button id="addBtn" class="btn btn-primary" title="Add org" aria-label="Add org"></button>
        <button
          id="importBtn"
          class="btn"
          title="Restore from backup"
          aria-label="Restore from backup"
        ></button>
        <button
          id="exportBtn"
          class="btn"
          title="Back up to file"
          aria-label="Back up to file"
        ></button>
        <input id="importFile" type="file" accept="application/json,.json" hidden />
      </div>

      <div id="formContainer" class="form-panel" hidden></div>
      <div id="auditPanel" class="form-panel" hidden></div>

      <ul id="credentialList" class="cred-list"></ul>

      <div id="emptyState" class="empty" hidden>
        <div class="empty-icon" id="emptyIcon"></div>
        <p class="empty-title">No saved orgs yet</p>
        <p class="empty-sub" id="emptySub">
          Add your first Salesforce login, or restore from a backup.
        </p>
      </div>

      <div id="toast" class="toast" role="status" hidden></div>

      <!-- Lock / setup overlay (shown when the encrypted vault is locked, or when
           enabling encryption). Covers the app so the list isn't usable while locked. -->
      <div id="lockScreen" class="lock-screen" hidden>
        <div class="lock-card">
          <img class="lock-logo" src="../icons/icon-128.png" alt="" />
          <h2 id="lockTitle">Vault locked</h2>
          <p id="lockHint" class="lock-hint"></p>

          <button id="lockDeviceBtn" class="btn btn-primary lock-device" type="button" hidden>
            <span class="lock-device-icon" id="lockDeviceIcon" aria-hidden="true"></span>
            <span id="lockDeviceLabel">Use biometric unlock</span>
          </button>
          <div id="lockOr" class="lock-or" hidden>or use your passphrase</div>

          <div class="lock-pw">
            <input
              id="lockPass"
              type="password"
              placeholder="Master passphrase"
              autocomplete="off"
            />
            <button
              id="lockPassToggle"
              class="icon-btn"
              type="button"
              aria-label="Show passphrase"
            ></button>
          </div>
          <div id="lockError" class="lock-error" hidden></div>
          <button id="lockBtn" class="btn btn-primary lock-submit">Unlock</button>
          <button id="lockReset" class="lock-reset" type="button" hidden>
            Forgot passphrase? Reset vault
          </button>
        </div>
      </div>
    </div>
    <!-- Portal for per-card overflow menus: rendered here (not as a card
         child) so they aren't clipped by .cred-card's overflow:hidden. -->
    <div id="cardMenuPortal"></div>
  </body>
</html>
