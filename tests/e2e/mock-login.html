<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mock Salesforce Login</title>
    <!-- A loadable same-origin favicon (1x1 PNG) so the favicon-recolor step has
         an image to tint. -->
    <link
      rel="icon"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
    />
  </head>
  <body>
    <!-- Mimics the Salesforce login form the extension targets: #username,
         #password, #Login. The button is type=button and records the click
         instead of navigating, so the e2e test can inspect the filled values. -->
    <h1>Mock Salesforce Login</h1>
    <input id="username" type="text" autocomplete="off" />
    <input id="password" type="password" autocomplete="off" />
    <input id="Login" type="button" value="Log In" />
    <script>
      window.__loginClicked = false;
      document.getElementById("Login").addEventListener("click", () => {
        window.__loginClicked = true;
      });
    </script>
  </body>
</html>
